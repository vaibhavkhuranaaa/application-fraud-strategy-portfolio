services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fraud_strategy
      POSTGRES_USER: fraud_strategy
      POSTGRES_PASSWORD:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_strategy -d fraud_strategy"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fraud-postgres:/var/lib/postgresql/data

  worker:
    build: .
    profiles: ["worker"]
    environment:
      FRAUD_DATABASE_URL:
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - ./evaluation:/app/evaluation

volumes:
  fraud-postgres:
